<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Token App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>
  <h1>Base Token App</h1>
  <button id="connectBtn">Connect Wallet</button>
<p id="walletAddress">Not connected</p>
<p>Balance: <span id="balance">-</span></p>
<input id="mintAmount" type="number" placeholder="Amount to mint" />
<button id="mintBtn">Mint</button>
document.getElementById("mintBtn").onclick = async () => {
  const amount = document.getElementById("mintAmount").value;
  const tx = await token.mint(await signer.getAddress(), ethers.parseEther(amount));
  await tx.wait();
  alert("Minted successfully!");
};

<script>
  async function updateBalance(address) {
    const provider = new ethers.BrowserProvider(window.ethereum);
    const balanceBigInt = await provider.getBalance(address);
    const balanceEth = ethers.formatEther(balanceBigInt);
    document.getElementById("balance").textContent = parseFloat(balanceEth).toFixed(6);
  }

  document.getElementById("connectBtn").onclick = async () => {
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    const address = accounts[0];
    document.getElementById("walletAddress").textContent = "Connected: " + address;
    await updateBalance(address);
  };
</script>
</body>
</html>
